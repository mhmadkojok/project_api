<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Product Description Generator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <h1 class="text-center mb-2">AI Product Description Generator</h1>
      <p class="text-center text-muted mb-4">Fill in your product details and let AI write a professional description for you.</p>

      <div class="card shadow-sm mb-4">
        <div class="card-body p-4">
          <form id="productForm">
            <div class="mb-3">
              <label for="productName" class="form-label">Product Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="productName" placeholder="e.g. Wireless Headphones" required>
            </div>

            <div class="mb-3">
              <label for="productCategory" class="form-label">Product Category <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="productCategory" placeholder="e.g. Electronics">
            </div>

            <div class="mb-3">
              <label for="productDetails" class="form-label">Short Product Details <span class="text-muted">(optional)</span></label>
              <textarea class="form-control" id="productDetails" rows="3" placeholder="e.g. Noise cancelling, 30-hour battery life, Bluetooth 5.0"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="generateBtn">
              Generate Description
            </button>
          </form>
        </div>
      </div>

      <div id="loadingIndicator" class="text-center mb-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted mt-2 mb-0">Generating your description...</p>
      </div>

      <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

      
      <div class="card shadow-sm d-none" id="resultCard">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Generated Description</h5>
            <button class="btn btn-outline-secondary btn-sm" id="copyBtn">
              Copy to Clipboard
            </button>
          </div>
          <p id="resultText" class="mb-0"></p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
